<main class="min-h-screen bg-[#172B35] p-4 text-[#E8DFC9]">
  @if (game(); as currentGame) {
    <header class="mb-6">
      <h1 class="text-2xl font-bold">SkullFlix</h1>
      <p class="mt-2 text-[#D7AD57]">Partie en cours</p>
    </header>

    <section>
      <h2 class="mb-4 text-xl font-semibold">Tableau des scores</h2>

      <app-score-table
        [players]="currentGame.players"
        [rounds]="currentGame.rounds"
        [totals]="totals()"
        (scoreChange)="onScoreChange($event)"
      />
    </section>
  } @else {
    <h1 class="text-2xl font-bold">Partie introuvable</h1>
    <p class="mt-2">Cette partie n'existe pas ou n'est plus disponible.</p>
  }
</main>
